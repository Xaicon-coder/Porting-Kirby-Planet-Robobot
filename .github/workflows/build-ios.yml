# PlanetPort: builds an unsigned PlanetPort.ipa on a GitHub-hosted Mac (no Mac needed).
# Works with the normal repository layout, or with the whole project uploaded from a browser
# as a single PlanetPort-src.zip in the repository root. Install the IPA with Sideloadly.

name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ios
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate sources
        run: |
          if [ -f PlanetPort-src.zip ]; then
            rm -rf src
            mkdir src
            unzip -q PlanetPort-src.zip -d src
            echo "SRC=$GITHUB_WORKSPACE/src" >> "$GITHUB_ENV"
          else
            echo "SRC=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          fi

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-ios-${{ github.run_id }}
          restore-keys: ccache-ios-

      - name: Build PlanetPort.ipa
        shell: bash
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          set -o pipefail
          bash "$SRC/scripts/ci_build.sh" "$GITHUB_WORKSPACE/PlanetPort.ipa" 2>&1 | tee ci.log

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PlanetPort-ipa
          path: PlanetPort.ipa
          if-no-files-found: error

      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest PlanetPort.ipa --target "$GITHUB_SHA" --prerelease --title "PlanetPort - ultima build" --notes "IPA non firmato. Installalo con Sideloadly (vedi README). Nessuna ROM inclusa."

      # Failure logs are published as a public "build-log" pre-release so they can be read
      # without signing in (workflow artifacts require a GitHub login to download).
      - name: Publish logs on failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p logs
          tail -n 3000 ci.log > logs/ci-tail.log 2>/dev/null || true
          cp ci.log logs/ 2>/dev/null || true
          cp "$SRC/build/xcodebuild.log" logs/ 2>/dev/null || true
          cp "$SRC/build/core/CMakeFiles/CMakeConfigureLog.yaml" logs/ 2>/dev/null || true
          gh release delete build-log --yes --cleanup-tag || true
          if ls logs/* >/dev/null 2>&1; then
            gh release create build-log logs/* --target "$GITHUB_SHA" --prerelease --title "Log ultima compilazione fallita" --notes "Log automatici della compilazione fallita." || true
          fi
