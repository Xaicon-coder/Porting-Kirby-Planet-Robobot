# PlanetPort - native iOS frontend for the Azahar 3DS emulator core.
# Copyright 2026 PlanetPort contributors. Licensed under GPLv2 or any later version.
#
# Builds an UNSIGNED PlanetPort.ipa on a GitHub-hosted Mac, so the app can be produced without
# owning a Mac. Sign and install it from Windows with Sideloadly (see README.md).
# The IPA is uploaded as a workflow artifact and published as the "latest" pre-release.

name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: PlanetPort.ipa (unsigned)
    runs-on: macos-15
    timeout-minutes: 240
    env:
      BUILD_TYPE: Release
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3G
      CCACHE_COMPRESS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install ninja xcodegen ccache
          xcodebuild -version
          cmake --version | head -n1
          ninja --version
          xcodegen --version
          python3 --version

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-ios-${{ hashFiles('scripts/fetch_azahar.sh') }}-${{ github.run_id }}
          restore-keys: |
            ccache-ios-${{ hashFiles('scripts/fetch_azahar.sh') }}-
            ccache-ios-

      - name: Build PlanetCore.framework (azahar core + bridge)
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CMAKE_OBJC_COMPILER_LAUNCHER: ccache
          CMAKE_OBJCXX_COMPILER_LAUNCHER: ccache
        run: |
          bash scripts/build_core.sh
          ccache --show-stats || true

      - name: Generate Xcode project
        working-directory: App
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project App/PlanetPort.xcodeproj \
            -target PlanetPort \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$GITHUB_WORKSPACE/build/xcode" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build/xcodebuild.log

      - name: Package IPA
        run: |
          APP="build/xcode/Release-iphoneos/PlanetPort.app"
          test -d "$APP" || { echo "PlanetPort.app not found"; exit 1; }
          test -f "$APP/Frameworks/PlanetCore.framework/PlanetCore" \
            || { echo "PlanetCore.framework was not embedded"; exit 1; }
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry "$GITHUB_WORKSPACE/PlanetPort.ipa" Payload)
          ls -lh PlanetPort.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlanetPort-ipa
          path: PlanetPort.ipa
          if-no-files-found: error

      - name: Publish "latest" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest PlanetPort.ipa \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "PlanetPort - ultima build" \
            --notes "IPA non firmato compilato dal commit $GITHUB_SHA. Installalo con Sideloadly (vedi README). Nessuna ROM inclusa: importa il tuo dump decriptato dall'app."

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/xcodebuild.log
            build/core/CMakeFiles/CMakeOutput.log
            build/core/CMakeFiles/CMakeError.log
            build/core/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
