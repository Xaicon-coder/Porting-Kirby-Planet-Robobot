# PlanetPort - XcodeGen project description.
# Generate the Xcode project with:  cd App && xcodegen generate
# PlanetCore.framework must be built first into ../build (see the core-bridge build scripts).

name: PlanetPort

options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  PlanetPort:
    type: application
    platform: iOS
    sources:
      - PlanetPort
    settings:
      base:
        PRODUCT_NAME: PlanetPort
        PRODUCT_BUNDLE_IDENTIFIER: org.planetport.app
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        # Language mode (Xcode accepts 4.0, 4.2, 5.0, 6.0); the Swift 5.9+ compiler is used.
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_BITCODE: "NO"
        SUPPORTED_PLATFORMS: iphoneos
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        # Keep the hand-written Info.plist and entitlements (XcodeGen must not regenerate them).
        INFOPLIST_FILE: PlanetPort/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: PlanetPort/PlanetPort.entitlements
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/../build"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - framework: ../build/PlanetCore.framework
        embed: true
        codeSign: true
      - sdk: GameController.framework
      - sdk: CoreMotion.framework
      - sdk: AVFoundation.framework
